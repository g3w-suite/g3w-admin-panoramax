[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=67",
    "setuptools_scm[toml]>=7.1",
]

[project]
name = "g3w-admin-panoramax"
dynamic = ["version"]
authors = [{ name = "Gis3w snc", email = "info@gis3w.it" }]
description = "G3W-ADMIN plugin that enables Panoramax controls on all maps."
readme = "README.md"
license = { text = "Mozilla Public License 2.0 (MPL 2.0)" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
"Homepage" = "https://github.com/g3w-suite/g3w-admin-panoramax"
"Bug Tracker" = "https://github.com/g3w-suite/g3w-admin-panoramax/issues"

[tool.setuptools]
packages = ["panoramax"]
package-dir = { panoramax = "panoramax" }

[tool.setuptools.package-data]
panoramax = ["static/panoramax/js/*.js"]

[tool.setuptools_scm]
fallback_version = "0.0.0-alpha.0"
write_to = "_version.py"
